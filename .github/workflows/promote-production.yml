name: Promote Hostinger Staging To Live

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST || '109.106.250.190' }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER || 'u514430741' }}
      LIVE_ROOT: ${{ vars.LIVE_ROOT || 'public_html' }}
      STAGING_SUBDIR: ${{ vars.STAGING_SUBDIR || 'test-git' }}
      BACKUP_ROOT: ${{ vars.BACKUP_ROOT || 'hostinger_backups/battlestroke' }}
      KEEP_BACKUPS: ${{ vars.KEEP_BACKUPS || '5' }}
    steps:
      - name: Validate required secret
        run: |
          if [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ]; then
            echo "Missing required secret: HOSTINGER_SSH_KEY" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          ssh-keyscan -T 15 -p "${HOSTINGER_PORT}" "${HOSTINGER_HOST}" >> ~/.ssh/known_hosts || true

      - name: Sync checkout to Hostinger staging
        run: |
          archive_name="battlestroke-${GITHUB_SHA}.tgz"

          tar -czf "${archive_name}" \
            index.html \
            about.html \
            faq.html \
            proclamation.html \
            stroke-symptoms.html \
            what-to-do-during-a-stroke.html \
            be-fast-vs-fast.html \
            home.css \
            pages.css \
            robots.txt \
            sitemap.xml \
            assets

          scp -P "${HOSTINGER_PORT}" "${archive_name}" "${HOSTINGER_USER}@${HOSTINGER_HOST}:${archive_name}"

          ssh -p "${HOSTINGER_PORT}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "bash -s -- '${LIVE_ROOT}/${STAGING_SUBDIR}' '${archive_name}'" <<'EOF'
          set -euo pipefail

          staging_root_raw="$1"
          archive_name="$2"

          resolve_path() {
            local raw="$1"
            local candidate=""

            if [[ "$raw" == /* ]]; then
              printf '%s\n' "$raw"
              return 0
            fi

            for candidate in "$raw" "$PWD/$raw" "$HOME/$raw"; do
              if [[ -e "$candidate" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done

            candidate="$(find "$HOME" -maxdepth 6 \( -type d -o -type f \) -path "*/$raw" 2>/dev/null | head -n 1 || true)"
            if [[ -n "$candidate" ]]; then
              printf '%s\n' "$candidate"
              return 0
            fi

            printf '%s\n' "$HOME/$raw"
          }

          staging_root="$(resolve_path "$staging_root_raw")"
          mkdir -p "$staging_root"
          tar -xzf "$HOME/$archive_name" -C "$staging_root"
          rm -f "$HOME/$archive_name"
          EOF

      - name: Promote staging to live with backup
        run: |
          chmod +x scripts/promote_hostinger_test_git.sh
          HOSTINGER_HOST="${HOSTINGER_HOST}" \
          HOSTINGER_PORT="${HOSTINGER_PORT}" \
          HOSTINGER_USER="${HOSTINGER_USER}" \
          LIVE_ROOT="${LIVE_ROOT}" \
          STAGING_SUBDIR="${STAGING_SUBDIR}" \
          BACKUP_ROOT="${BACKUP_ROOT}" \
          KEEP_BACKUPS="${KEEP_BACKUPS}" \
          scripts/promote_hostinger_test_git.sh --apply
