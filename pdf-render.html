<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Render</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    html, body {
      margin: 0;
      background: #ffffff;
    }

    .frame {
      width: 900px;
      height: 1300px;
      margin: 0 auto;
      background: #ffffff;
    }

    object {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="frame">
    <object data="assets/FINAL_FAST_POSTER_smaller_logo.pdf" type="application/pdf"></object>
  </div>
</body>
</html>
